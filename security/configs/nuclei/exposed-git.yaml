id: openseo-exposed-git-config
info:
  name: Exposed Git configuration
  author: openseo-security
  severity: medium
  classification:
    cwe-id: CWE-200
  tags: exposure
http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["[core]", "repositoryformatversion"]
        condition: and
