name: Security

on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Scan coverage
        type: choice
        options: [full, dast]
        default: full
      target:
        description: Authorized staging origin (DAST only; must match protected environment variable)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'static' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'dast'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SECURITY_SCAN_MODE: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
      SECURITY_IMAGE: open-seo:security-assessment
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test security pipeline controls
        run: |
          python3 -m unittest discover -s security -p 'test_*.py'
          python3 -m unittest discover -s security/tests -p 'test_*.py'
          python3 security/scanners/runtime_test.py
          python3 security/scanners/infrastructure-context-test.py
          python3 security/scanners/secrets-test.py
      - name: Set isolated scanner directory
        run: printf 'SECURITY_TOOLS_DIR=%s/security-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install scanners
        id: install
        # Scan still runs and records individual missing tools if install fails.
        continue-on-error: true
        run: bash security/install.sh "$SECURITY_SCAN_MODE"
      - name: Build local image for full scan
        if: env.SECURITY_SCAN_MODE == 'full'
        run: docker build --tag "$SECURITY_IMAGE" --file deploy/docker/Dockerfile .
      - name: Verify cold start and restart
        if: env.SECURITY_SCAN_MODE == 'full'
        env:
          SECURITY_SMOKE_REPORT: ${{ runner.temp }}/security-image-smoke.json
        run: python3 security/scanners/infrastructure-smoke.py
      - name: Scan repository
        if: ${{ !cancelled() }}
        run: bash security/scan.sh "$SECURITY_SCAN_MODE" "$RUNNER_TEMP/security-results"
      - name: Publish redacted registry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-results/findings.json
            ${{ runner.temp }}/security-results/findings.md
            ${{ runner.temp }}/security-results/findings.sarif
            ${{ runner.temp }}/security-image-smoke.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce scanner installation
        if: always() && steps.install.outcome != 'success'
        run: exit 1

  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dast'
    environment: security-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECURITY_DAST_TARGET: ${{ inputs.target }}
      SECURITY_DAST_ALLOWED_ORIGIN: ${{ vars.SECURITY_DAST_ALLOWED_ORIGIN }}
      SECURITY_DAST_AUTHORIZED: "yes"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set isolated scanner directory
        run: printf 'SECURITY_TOOLS_DIR=%s/security-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install runtime scanners
        id: install
        continue-on-error: true
        run: bash security/install.sh dast
      - name: Scan approved staging origin
        if: ${{ !cancelled() }}
        run: bash security/scan.sh dast "$RUNNER_TEMP/security-results"
      - name: Publish redacted registry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-results/findings.json
            ${{ runner.temp }}/security-results/findings.md
            ${{ runner.temp }}/security-results/findings.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Enforce scanner installation
        if: always() && steps.install.outcome != 'success'
        run: exit 1
